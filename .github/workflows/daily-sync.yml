name: Daily SEC Form D Startup Funding Sync

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run daily update script
        run: node scripts/update-daily.mjs

      - name: Commit and push updated dataset
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ README.md
            git commit -m "data: daily SEC Form D startup funding sync ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
